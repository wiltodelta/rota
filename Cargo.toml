[workspace]
resolver = "3"
members = [
    "crates/rota-platform",
    "crates/rota-core",
    "crates/rota-cli",
    "crates/rota-ui",
    "crates/rota-app",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rota-platform = { path = "crates/rota-platform" }
rota-core = { path = "crates/rota-core" }
rota-ui = { path = "crates/rota-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
regex-lite = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
libc = "0.2"
cc = "1"

winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
pollster = "0.4"
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree"] }
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }

objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-quartz-core = "0.3"
objc2-user-notifications = "0.3"
objc2-service-management = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"
