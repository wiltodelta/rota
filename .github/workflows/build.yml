name: Build Rota

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'glama.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
    - name: Checkout history for non-tag diff
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Detect build-relevant changes
      id: filter
      env:
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "build=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          base="$BASE_SHA"
          head="$HEAD_SHA"
        else
          base="$BEFORE_SHA"
          head="$GITHUB_SHA"
        fi
        if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] \
          || ! files=$(git diff --name-only "$base" "$head" 2>/dev/null) \
          || [[ -z "$files" ]]; then
          echo "build=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        build=false
        while IFS= read -r file; do
          [[ -z "$file" ]] && continue
          case "$file" in
            *.md|docs/*|.claude/*|glama.json) ;;
            *) build=true; break ;;
          esac
        done <<< "$files"
        echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # macOS 26 host: actool compiles the Icon Composer icon with macOS 26 system frameworks.
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      zip-sha256: ${{ steps.zip.outputs.sha256 }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Check the release tag (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
          { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
        HIGHEST="$(git tag -l 'v*' | sort -V | tail -1)"
        [[ "$HIGHEST" == "$GITHUB_REF_NAME" ]] ||
          { echo "::error::$GITHUB_REF_NAME is not above the existing tag $HIGHEST"; exit 1; }

    - name: Select Latest Xcode
      run: |
        echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
        LATEST_XCODE=$(ls /Applications | grep "Xcode" | sort -V | tail -1)
        echo "Using: $LATEST_XCODE"
        echo "LATEST_XCODE=$LATEST_XCODE" >> "$GITHUB_ENV"
        sudo xcode-select -s /Applications/$LATEST_XCODE/Contents/Developer

    - name: Install Rust Toolchain
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt,clippy
        rustup default stable
        rustup target add aarch64-apple-darwin
        rustc --version
        cargo --version

    - name: Display Build Environment
      run: |
        xcodebuild -version
        echo "Git tag: $(git describe --tags --abbrev=0 2>/dev/null || echo 'No tag found')"
        echo "Building version: $(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo '1.0.0')"

    - name: Clean build directory for release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      run: rm -rf target

    - name: Cache Cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: macos-26-cargo-reg-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          macos-26-cargo-reg-

    - name: Cache Cargo target (branch and PR)
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: macos-26-cargo-target-${{ env.LATEST_XCODE }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          macos-26-cargo-target-${{ env.LATEST_XCODE }}-

    - name: Lint, Security Audit, and File-Length Gate
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        cargo fmt --all -- --check
        OVER_LIMIT="$(find crates -name '*.rs' -print0 | xargs -0 wc -l | awk '$2 != "total" && $1 > 500 {print}')"
        if [[ -n "$OVER_LIMIT" ]]; then
          echo "::error::Rust source files exceed 500-line limit:"
          echo "$OVER_LIMIT"
          exit 1
        fi
        cargo clippy --workspace --all-targets -- -D warnings
        if ! command -v osv-scanner >/dev/null 2>&1; then
          brew install osv-scanner
        fi
        osv-scanner --lockfile=Cargo.lock

    - name: Run Rust Workspace Tests
      run: cargo test --workspace

    - name: Test diagnostic and review scripts
      run: python3 -B -m unittest discover -s scripts/tests -v

    - name: Import signing identity and notary credentials (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: |
        KEYCHAIN="$SIGNING_KEYCHAIN"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
        security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
          -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
        curl -sSf -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
        security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
        xcrun notarytool store-credentials notary-K2GT9Q4S6U --keychain "$KEYCHAIN" \
          --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
        rm "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
        security find-identity -v -p codesigning "$KEYCHAIN"
        echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

    - name: Create App Bundle (Developer ID with timestamp on tag, ad hoc otherwise)
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export RELEASE=1; fi
        ./create-app.sh

    - name: Notarize and zip (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        ./notarize.sh
        security lock-keychain "$SIGNING_KEYCHAIN"

    # The released zip's checksum, for the cask bump (the homebrew job).
    - name: Hash the zip (on tag)
      id: zip
      if: startsWith(github.ref, 'refs/tags/v')
      run: echo "sha256=$(shasum -a 256 Rota-v*-macOS.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    # The Sparkle feed installed apps read (SUFeedURL points at the latest
    # release's appcast.xml). It holds this release only, signed with the EdDSA
    # key, and embeds the release notes: the tag annotation's body, which is also
    # the GitHub release body, so the notes are written once, in `git tag -a`.
    - name: Generate the Sparkle appcast (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        FEED="$RUNNER_TEMP/appcast"
        mkdir -p "$FEED"
        ZIP=$(ls Rota-v*-macOS.zip)
        cp "$ZIP" "$FEED/"
        [[ $(git cat-file -t "$GITHUB_REF_NAME") == tag ]] ||
          { echo "::error::$GITHUB_REF_NAME must be an annotated tag (git tag -a)"; exit 1; }
        git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > release-notes.md
        echo "RELEASE_TITLE=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_ENV"
        grep -q '[^[:space:]]' release-notes.md ||
          { echo "::error::the $GITHUB_REF_NAME annotation has no body; it is the release notes"; exit 1; }
        cp release-notes.md "$FEED/${ZIP%.zip}.md"
        echo "$SPARKLE_PRIVATE_KEY" | target/sparkle-2.10.0/bin/generate_appcast \
          --ed-key-file - --embed-release-notes --maximum-deltas 0 \
          --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
          -o "$PWD/appcast.xml" "$FEED"
        grep -q 'sparkle:edSignature' appcast.xml
        cat appcast.xml

    - name: Zip unsigned build (not a tag)
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: ./notarize.sh --zip-only

    - name: Upload App Bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: Rota-macOS
        path: Rota-v*-macOS.zip
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          Rota-v*-macOS.zip
          appcast.xml
        name: ${{ env.RELEASE_TITLE }}
        body_path: release-notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove signing keychain
      if: always() && startsWith(github.ref, 'refs/tags/v')
      run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  # Points the Homebrew cask (wiltodelta/homebrew-tap) at the release just
  # published. A job here, not a workflow on `release`, because a release made
  # with GITHUB_TOKEN starts no other workflow. The cask derives its URL from
  # `version`, so version and sha256 are the whole bump. The key: see
  # docs/build-and-release.md.
  homebrew:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    # Without the key, checkout would fall back to GITHUB_TOKEN and fail only at
    # the push; say why up front.
    - name: Check the tap deploy key
      env:
        TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      run: |
        [ -n "$TAP_KEY" ] ||
          { echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set; the cask still points at the previous release"; exit 1; }

    - name: Checkout the tap
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: wiltodelta/homebrew-tap
        ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

    - name: Bump the cask
      env:
        SHA: ${{ needs.build.outputs.zip-sha256 }}
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME#v}"
        [ -n "$SHA" ]
        C=Casks/rota.rb
        sed -i -E "s|^  version \"[^\"]*\"|  version \"$VERSION\"|; s|^  sha256 \"[^\"]*\"|  sha256 \"$SHA\"|" "$C"
        grep -q "version \"$VERSION\"" "$C" && grep -q "sha256 \"$SHA\"" "$C"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$C"
        git commit -m "rota $VERSION" || { echo "Cask already current"; exit 0; }
        git push
